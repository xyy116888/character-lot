<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先天底色・后天塑造 | 你的性格说明书</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5f0e8'/%3E%3Ccircle cx='32' cy='32' r='22' stroke='%23e8b86b' stroke-width='2' fill='none'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23e8b86b'/%3E%3Ccircle cx='32' cy='14' r='2' fill='%23e8b86b'/%3E%3Ccircle cx='50' cy='32' r='2' fill='%23c9a0dc'/%3E%3Ccircle cx='32' cy='50' r='2' fill='%23e8b86b'/%3E%3Ccircle cx='14' cy='32' r='2' fill='%23c9a0dc'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
/* ===== 全局重置与变量 ===== */
:root {
  --bg-deep: #f5f0e8;
  --bg-mid: #ede6da;
  --bg-light: #faf6f0;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-border: rgba(200, 160, 90, 0.25);
  --gold: #c8963e;
  --gold-soft: #d4a84f;
  --purple-soft: #9b7bb8;
  --pink-soft: #c97a8e;
  --text-main: #2d2a26;
  --text-sub: #6b6560;
  --text-dim: #9a948c;
  --shadow-glow: 0 8px 32px rgba(180, 150, 100, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text-main);
  overflow-x: hidden;
  position: relative;
}

body {
  background:
    radial-gradient(ellipse at 20% 0%, rgba(200, 160, 90, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(155, 123, 184, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(250, 246, 240, 0.8) 0%, var(--bg-deep) 70%);
  min-height: 100vh;
}

/* 星空背景 */
.stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.star {
  position: absolute;
  background: #d4a84f;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  opacity: 0;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.3); }
}

/* ===== 视图容器 ===== */
.app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
}

.view {
  display: none;
  width: 100%;
  max-width: 480px;
  animation: fadeIn 0.5s ease;
}

.view.active {
  display: flex;
  flex-direction: column;
  align-items: center;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ===== 首页 ===== */
.home-icon {
  width: 80px;
  height: 80px;
  margin-bottom: 24px;
  position: relative;
  animation: float 4s ease-in-out infinite;
}

.home-icon svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 20px rgba(232, 184, 107, 0.4));
}

.home-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px;
  font-weight: 700;
  text-align: center;
  line-height: 1.4;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #b8862e 0%, var(--gold) 50%, var(--purple-soft) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.home-subtitle {
  font-size: 15px;
  color: var(--text-sub);
  text-align: center;
  margin-bottom: 32px;
  letter-spacing: 2px;
}

.home-desc {
  font-size: 14px;
  color: var(--text-sub);
  text-align: center;
  line-height: 1.8;
  margin-bottom: 40px;
  max-width: 320px;
}

.home-desc strong {
  color: var(--gold);
  font-weight: 500;
}

.start-btn {
  width: 100%;
  max-width: 320px;
  padding: 18px 40px;
  background: linear-gradient(135deg, var(--gold) 0%, #b8862e 100%);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 17px;
  font-weight: 700;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 30px rgba(232, 184, 107, 0.35);
  letter-spacing: 4px;
  position: relative;
  overflow: hidden;
}

.start-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s ease;
}

.start-btn:hover::before {
  left: 100%;
}

.start-btn:active {
  transform: scale(0.97);
}

.home-meta {
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  gap: 16px;
}

.home-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ===== 答题页 ===== */
.quiz-card {
  width: 100%;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 32px 24px 28px;
  box-shadow: var(--shadow-glow);
  position: relative;
  overflow: hidden;
}

.quiz-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.quiz-header {
  text-align: center;
  margin-bottom: 28px;
}

.quiz-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 4px;
  letter-spacing: 2px;
}

.quiz-subtitle {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.question-text {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.7;
  text-align: center;
  margin-bottom: 28px;
  color: var(--text-main);
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
}

.option-card {
  width: 100%;
  padding: 16px 20px;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(200, 160, 90, 0.15);
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: left;
  font-family: 'Noto Sans SC', sans-serif;
  position: relative;
  overflow: hidden;
}

.option-card:hover {
  background: rgba(200, 160, 90, 0.08);
  border-color: rgba(200, 160, 90, 0.35);
  transform: translateX(4px);
}

.option-card:active {
  transform: scale(0.98);
}

.option-card.selected {
  background: linear-gradient(135deg, rgba(200, 160, 90, 0.12) 0%, rgba(155, 123, 184, 0.08) 100%);
  border-color: var(--gold);
  color: var(--gold);
}

.option-card .option-label {
  display: inline-block;
  width: 24px;
  height: 24px;
  line-height: 24px;
  text-align: center;
  background: rgba(200, 160, 90, 0.12);
  border-radius: 50%;
  font-size: 12px;
  color: var(--gold);
  margin-right: 10px;
  flex-shrink: 0;
  vertical-align: middle;
}

.option-card.selected .option-label {
  background: var(--gold);
  color: #fff;
}

.quiz-footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.question-counter {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.question-counter strong {
  color: var(--gold);
  font-size: 16px;
  font-weight: 700;
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(200, 160, 90, 0.12);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple-soft), var(--gold));
  border-radius: 2px;
  transition: width 0.4s ease;
  box-shadow: 0 0 10px rgba(232, 184, 107, 0.5);
}

.back-btn {
  padding: 10px 28px;
  background: transparent;
  border: 1px solid rgba(200, 160, 90, 0.25);
  border-radius: 30px;
  color: var(--text-sub);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: 'Noto Sans SC', sans-serif;
  display: flex;
  align-items: center;
  gap: 6px;
}

.back-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.back-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* ===== 加载页 ===== */
.loading-view {
  text-align: center;
}

.loading-ring {
  width: 100px;
  height: 100px;
  margin: 0 auto 32px;
  position: relative;
}

.loading-ring svg {
  width: 100%;
  height: 100%;
  animation: spin 3s linear infinite;
}

.loading-ring .inner {
  animation: spin 2s linear infinite reverse;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50px;
  height: 50px;
}

.loading-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 12px;
  letter-spacing: 3px;
}

.loading-sub {
  font-size: 14px;
  color: var(--text-sub);
  line-height: 1.8;
  max-width: 280px;
}

.loading-dots {
  display: inline-flex;
  gap: 4px;
}

.loading-dots span {
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
  animation: pulse 1.4s ease-in-out infinite;
}

.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ===== 结果页 ===== */
.result-container {
  width: 100%;
  max-width: 480px;
}

.result-hero {
  text-align: center;
  padding: 40px 24px 32px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.result-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(200, 160, 90, 0.06) 0%, transparent 60%);
  animation: pulse 6s ease-in-out infinite;
}

.result-type-badge {
  display: inline-block;
  padding: 6px 18px;
  background: linear-gradient(135deg, rgba(200, 160, 90, 0.12), rgba(155, 123, 184, 0.1));
  border: 1px solid rgba(200, 160, 90, 0.35);
  border-radius: 30px;
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 2px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}

.result-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 900;
  line-height: 1.3;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #b8862e 0%, var(--gold) 40%, var(--purple-soft) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  z-index: 1;
}

.result-slogan {
  font-size: 15px;
  color: var(--text-sub);
  line-height: 1.8;
  max-width: 300px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.result-section {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(200, 160, 90, 0.12);
  border-radius: 20px;
  padding: 24px 20px;
  margin-bottom: 16px;
}

.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 1px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: linear-gradient(180deg, var(--gold), var(--purple-soft));
  border-radius: 2px;
}

.section-text {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text-main);
}

.section-text p {
  margin-bottom: 10px;
}

.section-text p:last-child {
  margin-bottom: 0;
}

.section-text .highlight {
  color: var(--gold);
  font-weight: 500;
}

/* 雷达图 */
.radar-container {
  width: 100%;
  height: 320px;
  margin: 0 auto;
}

/* 维度得分明细 */
.score-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.score-item {
  display: flex;
  align-items: center;
  gap: 12px;
}

.score-name {
  width: 80px;
  font-size: 13px;
  color: var(--text-sub);
  flex-shrink: 0;
}

.score-bar-wrap {
  flex: 1;
  height: 8px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 4px;
  overflow: hidden;
}

.score-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 1s ease;
}

.score-value {
  width: 36px;
  text-align: right;
  font-size: 13px;
  color: var(--gold);
  font-weight: 600;
  flex-shrink: 0;
}

/* 天赋与短板 */
.trait-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.trait-box {
  padding: 16px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(200, 160, 90, 0.12);
}

.trait-box.gift {
  border-color: rgba(200, 160, 90, 0.3);
  background: linear-gradient(135deg, rgba(200, 160, 90, 0.06), transparent);
}

.trait-box.weak {
  border-color: rgba(201, 122, 142, 0.3);
  background: linear-gradient(135deg, rgba(201, 122, 142, 0.06), transparent);
}

.trait-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.trait-box.gift .trait-label { color: var(--gold); }
.trait-box.weak .trait-label { color: var(--pink-soft); }

.trait-content {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-main);
}

/* 适配/避雷 */
.match-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.match-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.5);
}

.match-item.good {
  border-left: 3px solid var(--gold);
}

.match-item.bad {
  border-left: 3px solid var(--pink-soft);
}

.match-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  flex-shrink: 0;
  letter-spacing: 1px;
}

.match-item.good .match-tag {
  background: rgba(200, 160, 90, 0.12);
  color: var(--gold);
}

.match-item.bad .match-tag {
  background: rgba(201, 122, 142, 0.1);
  color: var(--pink-soft);
}

.match-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-main);
}

.match-desc {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* 心理提示 */
.tip-box {
  padding: 20px;
  background: linear-gradient(135deg, rgba(155, 123, 184, 0.08), rgba(200, 160, 90, 0.06));
  border: 1px solid rgba(155, 123, 184, 0.2);
  border-radius: 16px;
  position: relative;
}

.tip-box::before {
  content: '✦';
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 18px;
  color: var(--purple-soft);
  opacity: 0.5;
}

.tip-text {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text-main);
  font-style: italic;
}

/* 深度解读 */
.deep-read {
  font-size: 14px;
  line-height: 2;
  color: var(--text-main);
}

.deep-read h4 {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  color: var(--gold);
  margin: 18px 0 8px;
  font-weight: 600;
}

.deep-read h4:first-child {
  margin-top: 0;
}

.deep-read p {
  margin-bottom: 10px;
}

/* 分享文案 */
.share-text-box {
  padding: 16px;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(200, 160, 90, 0.15);
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-sub);
  white-space: pre-wrap;
  max-height: 200px;
  overflow-y: auto;
}

/* 操作按钮 */
.result-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  padding-bottom: 40px;
}

.action-btn {
  flex: 1;
  padding: 14px 20px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: 'Noto Sans SC', sans-serif;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.action-btn.primary {
  background: linear-gradient(135deg, var(--gold), #d4a04a);
  color: #1a1428;
  box-shadow: 0 4px 20px rgba(232, 184, 107, 0.3);
}

.action-btn.secondary {
  background: rgba(255, 255, 255, 0.7);
  color: var(--text-main);
  border: 1px solid rgba(200, 160, 90, 0.2);
}

.action-btn:active {
  transform: scale(0.96);
}

.retest-btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: transparent;
  border: 1px solid rgba(200, 160, 90, 0.25);
  border-radius: 30px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: 'Noto Sans SC', sans-serif;
}

.retest-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

/* Toast */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 14px 28px;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--gold);
  border-radius: 12px;
  color: var(--gold);
  font-size: 14px;
  z-index: 9999;
  animation: fadeIn 0.3s ease;
  backdrop-filter: blur(10px);
}

/* 响应式 */
@media (max-width: 380px) {
  .home-title { font-size: 28px; }
  .result-name { font-size: 30px; }
  .question-text { font-size: 16px; }
  .trait-grid { grid-template-columns: 1fr; }
}

@media (min-width: 768px) {
  .app { padding: 40px 20px; }
  .quiz-card { padding: 40px 32px 32px; }
  .question-text { font-size: 19px; }
}

/* 滚动条美化 */
::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(232, 184, 107, 0.3);
  border-radius: 2px;
}
</style>
</head>
<body>

<!-- 星空背景 -->
<div class="stars" id="stars"></div>

<div class="app">
  <!-- ===== 视图：首页 ===== -->
  <div class="view active" id="view-home">
    <div class="home-icon">

/* ===== 星空背景生成 ===== */
function createStars() {
  const container = document.getElementById('stars');
  if (!container) return;
  container.innerHTML = '';
  const count = window.innerWidth < 768 ? 60 : 100;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
    star.style.animationDelay = Math.random() * 3 + 's';
    container.appendChild(star);
  }
}

/* ===== 视图切换 ===== */
function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById(viewId);
  if (target) target.classList.add('active');
  window.scrollTo(0, 0);
}

/* ===== 开始测试 ===== */
function startQuiz() {
  currentQuestion = 0;
  answers = [];
  showView('view-quiz');
  renderQuestion();
}

/* ===== 渲染题目 ===== */
function renderQuestion() {
  const q = QUESTIONS[currentQuestion];
  if (!q) return;

  document.getElementById('question-text').textContent = q.text;
  document.getElementById('current-num').textContent = currentQuestion + 1;
  document.getElementById('progress-fill').style.width = ((currentQuestion + 1) / QUESTIONS.length * 100) + '%';

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-card';
    if (answers[currentQuestion] === idx) btn.classList.add('selected');
    btn.innerHTML = '<span class="option-label">' + labels[idx] + '</span>' + opt.text;
    btn.onclick = () => selectOption(idx);
    list.appendChild(btn);
  });

  // 返回按钮状态
  document.getElementById('back-btn').disabled = currentQuestion === 0;
}

/* ===== 选择选项 ===== */
function selectOption(idx) {
  answers[currentQuestion] = idx;

  // 更新选中状态
  document.querySelectorAll('.option-card').forEach((card, i) => {
    card.classList.toggle('selected', i === idx);
  });

  // 延迟进入下一题
  setTimeout(() => {
    if (currentQuestion < QUESTIONS.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      showLoading();
    }
  }, 300);
}

/* ===== 返回上一题 ===== */
function goBack() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

/* ===== 显示加载页 ===== */
function showLoading() {
  showView('view-loading');
  setTimeout(() => {
    calculateResult();
    showView('view-result');
    renderResult();
  }, 2500);
}

/* ===== 计算结果 ===== */
function calculateResult() {
  // 初始化十维分数
  const scores = new Array(DIMENSIONS.length).fill(0);
  const count = new Array(DIMENSIONS.length).fill(0);

  // 累加每道题的分数
  answers.forEach((ansIdx, qIdx) => {
    const q = QUESTIONS[qIdx];
    if (!q || ansIdx === undefined) return;
    const opt = q.options[ansIdx];
    if (!opt || !opt.scores) return;
    for (const [dimIdx, score] of Object.entries(opt.scores)) {
      scores[parseInt(dimIdx)] += score;
      count[parseInt(dimIdx)]++;
    }
  });

  // 计算平均分（0-100）
  const finalScores = scores.map((s, i) => {
    if (count[i] === 0) return 50;
    return Math.round((s / count[i] / 5) * 100);
  });

  // 判定类型
  const type = determineType(finalScores);
  resultData = { type: type, scores: finalScores };
}

/* ===== 判定命格类型 ===== */
function determineType(scores) {
  // scores: [宿命认同度(越高越不宿命), 改行动力, 标签挣脱度, 决策自主度, 心性可塑性, 意义稳定度, 先天接纳度, 后天掌控感, 挫折复原力, 成长开放度]
  const fatalism = 100 - scores[0]; // 宿命程度（越高越宿命）
  const action = scores[1];
  const labelFree = scores[2];
  const decision = scores[3];
  const nature = scores[4];
  const meaning = scores[5];
  const control = scores[7];
  const growth = scores[9];

  // 计算各类型匹配度
  const typeScores = {
    fated_lazy: fatalism * 1.5 + (100 - action) * 1.2 + (100 - meaning) * 0.8, // 天选摆烂家
    mystic_collector: action * 0.5 + fatalism * 0.5 + (100 - control) * 1.0, // 玄学收藏家（有行动力但方向偏）
    fate_prisoner: (100 - labelFree) * 1.5 + (100 - nature) * 1.0 + fatalism * 0.5, // 命格囚徒
    decision_paralysis: (100 - decision) * 1.5 + fatalism * 0.8 + (100 - control) * 0.5, // 选择困难星人
    nature_fixed: (100 - nature) * 1.5 + (100 - action) * 0.8 + fatalism * 0.5, // 本性难移党
    effort_doubter: (100 - meaning) * 1.5 + (100 - scores[8]) * 0.8 + fatalism * 0.5, // 努力怀疑论者
    sober_observer: Math.abs(scores[0] - 60) * -1 + scores[6] * 0.5 + scores[3] * 0.5, // 人间清醒客（中间值）
    destiny_maker: action * 1.2 + control * 1.2 + growth * 1.0 + nature * 0.8 // 后天操盘手
  };

  // 特殊规则：如果整体都很高（>70），归为后天操盘手
  const avg = (action + control + growth + nature + scores[8] + meaning) / 6;
  if (avg > 72 && scores[0] > 60) {
    return 'destiny_maker';
  }

  // 如果宿命认同度很高（>70，即很不宿命）且其他维度中等，归为人间清醒客
  if (scores[0] > 65 && avg > 55 && avg < 72) {
    return 'sober_observer';
  }

  // 取匹配度最高的类型
  let maxType = 'fated_lazy';
  let maxScore = -Infinity;
  for (const [type, score] of Object.entries(typeScores)) {
    if (score > maxScore) {
      maxScore = score;
      maxType = type;
    }
  }

  return maxType;
}

/* ===== 渲染结果 ===== */

  document.getElementById('cause').innerHTML = '<p>' + type.cause + '</p>';

  document.getElementById('trait-gift').textContent = type.gift;
  document.getElementById('trait-weak').textContent = type.weak;

    matchList.appendChild(item);

  // 维度得分明细
  renderScoreList();

  // 雷达图
  setTimeout(() => renderRadar(), 100);

/* ===== 渲染雷达图 ===== */
function renderRadar() {
  try {
    const container = document.getElementById('radar-chart');
    if (!container) return;

    // 安全销毁已有实例
    if (radarChart) {
      try {
        radarChart.dispose();
      } catch (e) {
        console.warn('雷达图销毁失败:', e);
      }
      radarChart = null;
    }

    radarChart = echarts.init(container);

    const option = {
      backgroundColor: 'transparent',
      tooltip: {
        backgroundColor: 'rgba(255, 255, 255, 0.95)',
        borderColor: 'rgba(200, 160, 90, 0.4)',
        borderWidth: 1,
        textStyle: { color: '#2d2a26', fontSize: 12 },
        formatter: function(params) {
          let str = params.name + '<br/>';
          params.value.forEach((v, i) => {
            str += DIMENSIONS[i].name + ': ' + v + '<br/>';
          });
          return str;
        }
      },
      radar: {
        indicator: DIMENSIONS.map(d => ({ name: d.name, max: 100 })),
        shape: 'polygon',
        splitNumber: 4,
        axisName: {
          color: '#6b6560',
          fontSize: 11,
          fontWeight: 500
        },
        splitLine: {
          lineStyle: { color: 'rgba(200, 160, 90, 0.15)' }
        },
        splitArea: {
          areaStyle: {
            color: ['rgba(200, 160, 90, 0.03)', 'rgba(155, 123, 184, 0.04)']
          }
        },
        axisLine: {
          lineStyle: { color: 'rgba(200, 160, 90, 0.15)' }
        }
      },
      series: [{
        type: 'radar',
        data: [{
          value: resultData.scores,
          name: '性格维度',
          symbol: 'circle',
          symbolSize: 6,
          itemStyle: { color: '#c8963e' },
          lineStyle: { color: '#c8963e', width: 2 },
          areaStyle: {
            color: new echarts.graphic.RadialGradient(0.5, 0.5, 1, [
              { offset: 0, color: 'rgba(200, 160, 90, 0.35)' },
              { offset: 1, color: 'rgba(155, 123, 184, 0.12)' }
            ])
          }
        }]
      }]
    };

    radarChart.setOption(option);

    // 响应式
    window.addEventListener('resize', () => {
      if (radarChart) {
        try { radarChart.resize(); } catch (e) {}
      }
    });
  } catch (e) {
    console.error('雷达图渲染异常:', e);
    // 错误兜底：显示文字版
    const container = document.getElementById('radar-chart');
    if (container) {
      container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#6b6560;font-size:14px;">雷达图加载失败，但你的性格数据已在下方明细中呈现</div>';
    }
  }
}

/* ===== 一键复制 ===== */
function copyResult() {
  if (!resultData) return;
  const type = TYPES[resultData.type];
  const text = type.shareText + '\n\n---\n【性格十维】\n' +
    DIMENSIONS.map((d, i) => d.name + ': ' + resultData.scores[i]).join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('已复制到剪贴板');
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制到剪贴板');
  } catch (e) {
    showToast('复制失败，请手动复制');
  }
  document.body.removeChild(ta);
}

/* ===== 保存PNG ===== */
function savePNG() {
  const target = document.getElementById('result-capture');
  if (!target) return;

  showToast('正在生成图片...');

  // 先滚动到顶部确保完整捕获
  window.scrollTo(0, 0);

  setTimeout(() => {
    html2canvas(target, {
      backgroundColor: '#f5f0e8',
      scale: 2,
      useCORS: true,
      logging: false,
      width: target.scrollWidth,
      height: target.scrollHeight
    }).then(canvas => {
      try {
        const link = document.createElement('a');
        link.download = '我的性格报告_' + TYPES[resultData.type].name + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('图片已保存');
      } catch (e) {
        showToast('保存失败，请截图保存');
      }
    }).catch(err => {
      console.error('截图失败:', err);
      showToast('生成失败，请手动截图');
    });
  }, 300);
}

/* ===== Toast提示 ===== */
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 1800);
}

/* ===== 重新测试 ===== */
function restartQuiz() {
  // 彻底清空全局状态
  currentQuestion = 0;
  answers = [];
  resultData = null;

  // 销毁雷达图
  if (radarChart) {
    try { radarChart.dispose(); } catch (e) {}
    radarChart = null;
  }

  // 清空DOM残留
  const scoreList = document.getElementById('score-list');
  if (scoreList) scoreList.innerHTML = '';
  const matchList = document.getElementById('match-list');
  if (matchList) matchList.innerHTML = '';

  // 回到首页
  showView('view-home');
}

/* ===== 初始化 ===== */
document.addEventListener('DOMContentLoaded', () => {
  createStars();

});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(createStars, 300);
});
